<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient (RedTeam Crimson) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Shield Face Highlight Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#450A0A" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded Squircle Emblem Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.2" />

  <!-- Protective Security Shield -->
  <g filter="url(#shadow)">
    <!-- Shield Outer Shell -->
    <path
      d="M32 10 L48.5 16.5 C48.5 32 39.5 46.5 32 52 C24.5 46.5 15.5 32 15.5 16.5 Z"
      fill="url(#shieldGrad)"
    />

    <!-- Right-half Lighting Shading -->
    <path
      d="M32 10 L48.5 16.5 C48.5 32 39.5 46.5 32 52 Z"
      fill="#DC2626"
      fill-opacity="0.08"
    />

    <!-- Assurance Checkmark in Red -->
    <path
      d="M24.5 30 L29.5 35 L39.5 23"
      fill="none"
      stroke="#DC2626"
      stroke-width="4.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>

